name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/get-three.mjs
      - run: for f in public/js/*.js scripts/*.mjs tests/*.mjs; do node --check $f; done
      - run: node scripts/build-pages.mjs && git diff --exit-code -- public || echo "pages were stale"
      - run: node scripts/check-links.mjs
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium && node tests/smoke.mjs
      - run: npx -y @lhci/cli@0.13 autorun
