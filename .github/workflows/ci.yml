name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: for f in src/js/*.js scripts/*.mjs tests/*.mjs; do node --check $f; done
      - run: npm run build
      - run: node scripts/check-links.mjs
      - run: npx playwright install --with-deps chromium && node tests/smoke.mjs
      - run: npx -y @lhci/cli@0.13 autorun
